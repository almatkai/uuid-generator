tokio = { version = "=1.47.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tempfile = "=3.19.1"
log = "=0.4.27"
uuid = { version = "=1.16.0", features = ["v4"] }
tauri = { path = "../tauri-stub" }
[workspace]
